name: Test 🧪

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run tests 🦀
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: bun install
      - name: Check version sync
        run: |
          bun scripts/syncVersion.ts
          if ! git diff --exit-code Cargo.toml; then
            echo "Error: Cargo.toml version is out of sync with package.json"
            echo "Run 'bun scripts/syncVersion.ts' to fix"
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test
