<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --border: #e4e6eb;
        --text: #1a1b1e;
        --muted: #6b7280;
        --accent: #16a34a;
        --accent-text: #ffffff;
        --danger: #dc2626;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #171a21;
          --border: #262b35;
          --text: #e6e8ec;
          --muted: #9aa3b2;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: var(--card);
      }
      header h1 { font-size: 1.1rem; margin: 0; }
      header .dot { font-size: 1.2rem; }
      main { max-width: 820px; margin: 0 auto; padding: 1.25rem; }
      h2 { font-size: 0.95rem; color: var(--muted); font-weight: 600; margin: 1.5rem 0 0.75rem; }
      .grid { display: grid; gap: 0.75rem; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .card .meta { min-width: 0; }
      .card .name { font-weight: 600; }
      .card .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }
      button {
        font: inherit;
        font-weight: 600;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.45rem 0.9rem;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
        white-space: nowrap;
      }
      button.secondary { background: transparent; color: var(--text); }
      button:disabled { opacity: 0.5; cursor: default; }
      .badge {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.running { color: var(--accent); border-color: var(--accent); }
      .empty { color: var(--muted); font-size: 0.9rem; }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 1.25rem;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 0.6rem 1rem;
        border-radius: 0.5rem;
        font-size: 0.85rem;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" aria-hidden="true">&#127939;</span>
      <h1>Run</h1>
    </header>
    <main>
      <h2>Your stacks</h2>
      <div id="stacks" class="grid"><p class="empty">Loading…</p></div>

      <h2>Catalog</h2>
      <div id="catalog" class="grid"><p class="empty">Loading…</p></div>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      const el = (id) => document.getElementById(id);
      let toastTimer;
      const toast = (msg) => {
        const t = el("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
      };

      const json = async (url, opts) => {
        const res = await fetch(url, opts);
        if (!res.ok) throw new Error((await res.text()) || res.statusText);
        return res.status === 204 ? null : res.json();
      };

      const act = async (id, action, btn) => {
        btn.disabled = true;
        const label = btn.textContent;
        btn.textContent = action === "up" ? "Starting…" : "Stopping…";
        try {
          await json(`/api/stacks/${id}/${action}`, { method: "POST" });
          toast(`${id} ${action === "up" ? "started" : "stopped"}.`);
          await refresh();
        } catch (e) {
          toast(e.message || "Something went wrong.");
          btn.disabled = false;
          btn.textContent = label;
        }
      };

      const renderStacks = (stacks) => {
        const box = el("stacks");
        if (!stacks.length) {
          box.innerHTML = '<p class="empty">No stacks yet. Start one from the catalog below.</p>';
          return;
        }
        box.innerHTML = "";
        for (const s of stacks) {
          const running = s.status === "running";
          const card = document.createElement("div");
          card.className = "card";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `<div class="name"></div><div class="sub"><span class="badge ${running ? "running" : ""}"></span></div>`;
          meta.querySelector(".name").textContent = s.name;
          meta.querySelector(".badge").textContent = s.status;
          const btn = document.createElement("button");
          btn.className = "secondary";
          btn.textContent = running ? "Stop" : "Start";
          btn.onclick = () => act(s.name, running ? "down" : "up", btn);
          card.append(meta, btn);
          box.append(card);
        }
      };

      const renderCatalog = (apps) => {
        const box = el("catalog");
        box.innerHTML = "";
        for (const a of apps) {
          const card = document.createElement("div");
          card.className = "card";
          const meta = document.createElement("div");
          meta.className = "meta";
          const svc = `${a.serviceCount} service${a.serviceCount === 1 ? "" : "s"}`;
          meta.innerHTML = `<div class="name"></div><div class="sub"></div>`;
          meta.querySelector(".name").textContent = a.name;
          meta.querySelector(".sub").textContent = a.description ? `${a.description} · ${svc}` : svc;
          const btn = document.createElement("button");
          btn.textContent = "Run locally";
          btn.onclick = () => act(a.id, "up", btn);
          card.append(meta, btn);
          box.append(card);
        }
      };

      const refresh = async () => {
        try {
          const [stacks, cat] = await Promise.all([json("/api/stacks"), json("/api/catalog")]);
          renderStacks(stacks);
          renderCatalog(cat);
        } catch (e) {
          toast(e.message || "Could not reach the run server.");
        }
      };

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
